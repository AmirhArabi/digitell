{% extends 'base.html' %}

{% block title %}ورود به حساب کاربری | فروشگاه دیجی تل{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xs">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-black text-xl mx-auto mb-3 shadow-md shadow-blue-500/20">
                Z
            </div>
            <h1 class="text-lg font-black text-slate-900">ورود به حساب کاربری دیجی تل</h1>
            <p class="text-xs text-slate-500 mt-1">با نام کاربری یا شماره موبایل وارد شوید</p>
        </div>

        <form method="post" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-semibold text-slate-700 mb-1.5">نام کاربری یا شماره موبایل:</label>
                <input
                    type="text"
                    name="login_id"
                    required
                    placeholder="مثال: 09123456789 یا admin"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                >
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="font-semibold text-slate-700">رمز عبور:</label>
                </div>
                <input
                    type="password"
                    name="password"
                    required
                    placeholder="••••••••"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                >
            </div>

            <button
                type="submit"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-blue-500/20 transition"
            >
                ورود به حساب
            </button>
        </form>

        <div class="pt-6 mt-6 border-t border-slate-100 text-center text-xs text-slate-500">
            <span>هنوز حساب کاربری ندارید؟</span>
            <a href="{% url 'accounts:register' %}" class="text-blue-600 font-bold hover:underline mr-1">
                ثبت نام در دیجی تل
            </a>
        </div>
    </div>
</div>
{% endblock %}
