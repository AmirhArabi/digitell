{% extends 'base.html' %}

{% block title %}ثبت نام در فروشگاه دیجی تل{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xs">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-black text-xl mx-auto mb-3 shadow-md shadow-blue-500/20">
                Z
            </div>
            <h1 class="text-lg font-black text-slate-900">عضویت در فروشگاه دیجی تل</h1>
            <p class="text-xs text-slate-500 mt-1">ایجاد حساب کاربری جدید برای خرید آنلاین و پیگیری سفارشات</p>
        </div>

        <form method="post" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-semibold text-slate-700 mb-1.5">نام کاربری *</label>
                <input
                    type="text"
                    name="username"
                    required
                    placeholder="مثال: amir_rad"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                >
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1.5">شماره موبایل *</label>
                <input
                    type="tel"
                    name="phone_number"
                    required
                    placeholder="09123456789"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                >
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5">نام:</label>
                    <input
                        type="text"
                        name="first_name"
                        placeholder="علی"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                    >
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5">نام خانوادگی:</label>
                    <input
                        type="text"
                        name="last_name"
                        placeholder="رضایی"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                    >
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1.5">کلمه عبور *</label>
                <input
                    type="password"
                    name="password"
                    required
                    placeholder="••••••••"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                >
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1.5">تکرار کلمه عبور *</label>
                <input
                    type="password"
                    name="password_confirm"
                    required
                    placeholder="••••••••"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                >
            </div>

            <button
                type="submit"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-blue-500/20 transition mt-2"
            >
                ثبت‌نام و ورود
            </button>
        </form>

        <div class="pt-6 mt-6 border-t border-slate-100 text-center text-xs text-slate-500">
            <span>قبلاً ثبت نام کرده‌اید؟</span>
            <a href="{% url 'accounts:login' %}" class="text-blue-600 font-bold hover:underline mr-1">
                ورود به حساب
            </a>
        </div>
    </div>
</div>
{% endblock %}
