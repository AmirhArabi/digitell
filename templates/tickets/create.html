{% extends 'base.html' %}

{% block title %}ثبت تیکت جدید | پشتیبانی دیجی تل{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-10">
    <a href="{% url 'tickets:list' %}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-blue-600 transition mb-6">
        <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        بازگشت به تیکت‌ها
    </a>

    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-xs">
        <h1 class="text-xl font-black text-slate-900 mb-1">ثبت تیکت پشتیبانی جدید</h1>
        <p class="text-xs text-slate-500 mb-6">موضوع را شرح دهید؛ کارشناسان ما در اولین فرصت پاسخ می‌دهند.</p>

        <form method="post" action="{% url 'tickets:create' %}" class="space-y-5 text-sm">
            {% csrf_token %}

            <div>
                <label class="block font-bold text-slate-700 mb-2">عنوان تیکت <span class="text-rose-500">*</span></label>
                <input type="text" name="subject" required maxlength="200" placeholder="مثلاً: پیگیری سفارش ۱۲۳۴۵"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block font-bold text-slate-700 mb-2">دسته‌بندی</label>
                    <select name="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:outline-none focus:border-blue-500">
                        {% for value, label in category_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-2">اولویت</label>
                    <select name="priority" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:outline-none focus:border-blue-500">
                        {% for value, label in priority_choices %}
                            <option value="{{ value }}" {% if value == 'normal' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-2">شماره سفارش (اختیاری)</label>
                    <input type="text" name="order_number" maxlength="30" placeholder="مثلاً: ZT-10023"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:bg-white focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-2">شرح مسئله <span class="text-rose-500">*</span></label>
                <textarea name="body" required rows="6" placeholder="جزئیات مشکل یا سؤال خود را بنویسید..."
                          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm leading-relaxed focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-2">
                <a href="{% url 'tickets:list' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold transition">انصراف</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold transition shadow-xs">ارسال تیکت</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
